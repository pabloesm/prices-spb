[project]
name = "prices-spb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "dnspython",
    "httpx",
    "playwright",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "types-beautifulsoup4",
    "types-psycopg2",
    "validators",
]

[dependency-groups]
dev = [
    "mypy",
    "mypy-extensions",
    "pdbpp",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestCacheWarning"
]
