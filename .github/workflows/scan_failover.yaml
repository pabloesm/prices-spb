name: Scan Failover

env:
  PYTHONUNBUFFERED: "1"

on:
  workflow_dispatch:
    inputs:
      trigger_message:
        description: "Message from the API"
        required: true
        default: "No message provided"
      operation:
        description: "Operation to perform, possible values: scan, store"
        required: true
        default: "scan"
      partial:
        description: "Partial to perform the operation, possible values: first_half, second_half"
        required: true
        default: "first_half"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Update package lists
        run: sudo apt-get update

      - name: Install OpenVPN
        run: |
          sudo apt-get --assume-yes --no-install-recommends install openvpn
          openvpn --version

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Playwright browser
        run: uv run playwright install chromium

      - name: Ruff
        run: uv run ruff check src/ && uv run ruff format --check src/

      - name: Mypy
        run: uv run mypy src/

      - name: Run
        uses: nick-fields/retry@v3
        env:
          DATABASE_NEON_URL: ${{ secrets.DATABASE_NEON_URL }}
          URL_SEED: ${{ secrets.URL_SEED }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          API_URL_TEMPLATE: ${{ vars.API_URL_TEMPLATE }}
          CF_URL: ${{ vars.CF_URL }}
        with:
          timeout_minutes: 360
          max_attempts: 2
          retry_on: error
          command: sudo -E .venv/bin/python app.py --operation ${{ github.event.inputs.operation }} --partial ${{ github.event.inputs.partial }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            ./scanned_prodcts.pkl
            logger_msgs.log
