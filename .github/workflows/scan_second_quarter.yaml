name: Scan products (get IDs) second quarter

env:
  PYTHONUNBUFFERED: "1"

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Update package lists
        run: sudo apt-get update

      - name: Install OpenVPN
        run: |
          sudo apt-get --assume-yes --no-install-recommends install openvpn
          openvpn --version

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Playwright browser
        run: uv run playwright install chromium

      - name: Ruff
        run: uv run ruff check src/ && uv run ruff format --check src/

      - name: Mypy
        run: uv run mypy src/

      - name: Run
        env:
          DATABASE_NEON_URL: ${{ secrets.DATABASE_NEON_URL }}
          URL_SEED: ${{ secrets.URL_SEED }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          API_URL_TEMPLATE: ${{ vars.API_URL_TEMPLATE }}
          CF_URL: ${{ vars.CF_URL }}
        run: |
          sudo -E .venv/bin/python app.py --operation scan --partial second_quarter

      - name: Handle failure
        if: ${{ failure() }}
        env:
          URL_WEBHOOK_MAKE: ${{ secrets.URL_WEBHOOK_MAKE }}
        run: |
          echo "Run step failed. Handling failure..."
          # Launch the scan_failover workflow (delayed)
          curl $URL_WEBHOOK_MAKE -H "Content-Type: application/json" -d '{"operation": "scan", "partial": "second_quarter"}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            ./scanned_products.pkl
            logger_msgs.log
